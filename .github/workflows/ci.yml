name: Pure Java CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup Java Environment (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Compile, Package, and Execute JUnit Tests automatically
    - name: Build and Test with Maven (JUnit)
      run: mvn clean package

    # 4. Log in to Docker Hub securely
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. Build and Push the Docker Image directly to your account
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          aishhwarya/even-odd-checker:latest
          aishhwarya/even-odd-checker:${{ github.run_number }}
