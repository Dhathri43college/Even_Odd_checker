name: Pure Java CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup Java Environment (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Compile, Package, and Execute JUnit Tests automatically
    - name: Build and Test with Maven (JUnit)
      run: mvn clean package

    # 4. Build Docker Image (Only runs if JUnit tests pass successfully)
    - name: Build Docker Image
      run: |
        docker build -t even-odd-pipeline:latest .

    # 5. Verify the container executes properly by passing an argument
    - name: Verify Container Execution
      run: docker run --rm even-odd-pipeline:latest 12
